name: lubelogger_mobile
description: "Native Android app for LubeLogger — a self-hosted vehicle maintenance manager."
publish_to: 'none'

version: 0.4.3+403000

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Bug-report transport, outbox and redactor, shared with bambuddy-mobile.
  # Pinned by tag, so a change over there reaches a release here only through a
  # commit in this repo. Must be the ref `app_diagnostics` names for its own
  # copy: one package resolved from two refs fails version solving.
  app_report_client:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.2.0
      path: packages/app_report_client
  # The recording session, the log record and the probes. Same repository, same
  # pinning rule, and the same ref `app_report_ui` names for its own copy.
  app_diagnostics:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.12.2
      path: packages/app_diagnostics
  # The report screens — the guided flow, the recording bar and the review —
  # shared with bambuddy-mobile.
  app_report_ui:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.12.2
      path: packages/app_report_ui
  # The design system and the widgets that name themselves in the diagnostic
  # log, shared with bambuddy-mobile. `dash_kit` re-exports `dash_ui`, so this
  # is the only one named here; it pins `dash_ui` at the ref `app_report_ui`
  # names for its own copy.
  dash_kit:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.12.2
      path: packages/dash_kit
  # JSON coercion, user-typed numbers, the demo adapter, the server address and
  # the request-failure classification, shared with bambuddy-mobile.
  app_util:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.12.2
      path: packages/app_util
  # SHA-256 keys for the HTTP cache.
  crypto: ^3.0.6
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^18.0.2
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  package_info_plus: ^9.0.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.0.1
  # Pinned to 8.x: file_picker 11.x's Android Kotlin module fails to link with
  # this project's Gradle/Flutter toolchain (GeneratedPluginRegistrant can't
  # resolve FilePickerPlugin). 8.x is stable here.
  file_picker: ^8.3.0
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  quick_actions: ^1.1.0
  flutter_slidable: ^4.0.3
  # Opens the issue URL the relay hands back, in the system browser.
  url_launcher: ^6.3.0
  # Downscales camera photos before they are attached to a record. Native rather
  # than the pure-Dart `image` package: decoding a 12 MP JPEG in Dart blocks for
  # seconds, and this runs while the user waits on the form.
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The source scans behind the spacing, wrap, short-word and finder tests, and
  # the `glue_short_words` tool `just l10n-glue` runs. Shared with
  # bambuddy-mobile, pinned like the packages above.
  app_guards:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.12.2
      path: packages/app_guards
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Demo-mode vehicle photos (store-review mode; served offline as assets).
    - assets/demo/car_photo1.jpg
    - assets/demo/car_photo2.webp

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FCBD0E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
